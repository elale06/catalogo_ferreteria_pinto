{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
    <title>Eliminar producto - Ferreteria Pinto</title>
</head>
<body>
<header class="site-header"><div class="header-inner"><a class="brand" href="/">Ferretería <span>Pinto</span></a>{% include "nav_principal.html" %}</div></header>
<main class="container">
    <div class="page-heading"><div><p class="eyebrow">Administración</p><h1>Eliminar producto</h1></div></div>
    <p class="delete-warning">Confirma si deseas eliminar <strong>{{ producto.nombre }}</strong>. Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions"><button class="button-danger" type="submit">Eliminar producto</button>
        <a class="button button-ghost" href="{% url 'categorias:acceso' %}">Cancelar y volver a gestión</a></div>
    </form>
</main>
</body>
</html>
